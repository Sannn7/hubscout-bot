upstream hubscout_api {
    least_conn;
    server api:8000;
}

server {
    listen 80;
    server_name hubscout.example.com;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req zone=api_limit burst=20 nodelay;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/hubscout_access.log;
    error_log /var/log/nginx/hubscout_error.log;

    # API endpoints
    location /api/ {
        proxy_pass http://hubscout_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check
    location /health {
        proxy_pass http://hubscout_api/health;
    }

    # Metrics (internal only)
    location /metrics {
        proxy_pass http://hubscout_api/metrics;
        allow 10.0.0.0/8;
        deny all;
    }
}